<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef1fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Três Fases" />
  <title>Três Fases — Gestão Semanal</title>
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <link id="dynamic-manifest" rel="manifest" />
  <style>
    :root {
      --bg-page: #f5f6fb;
      --bg-card: #ffffff;
      --bg-subtle: #f0f2f9;
      --text-primary: #1f2437;
      --text-secondary: #5e6780;
      --text-muted: #8b93a8;
      --border-soft: #e3e7f2;
      --border-strong: #cdd4e6;

      --overview-bg: #efeafd;
      --overview-border: #d5c9fa;
      --overview-accent: #5b3fd9;

      --phase1-bg: #eef5ff;
      --phase1-border: #cfe0ff;
      --phase1-accent: #2563eb;

      --phase2-bg: #ebfbf3;
      --phase2-border: #c5f0da;
      --phase2-accent: #15803d;

      --phase3-bg: #fff6e6;
      --phase3-border: #ffe2b0;
      --phase3-accent: #c2590a;

      --danger-bg: #fff1f2;
      --danger-border: #fecdd3;
      --danger-text: #be123c;

      --shadow-sm: 0 2px 8px rgba(31, 36, 55, 0.05);
      --shadow-md: 0 8px 24px rgba(31, 36, 55, 0.08);
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 10px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      overflow-x: clip;
    }

    button, input, select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 14px 48px;
    }

    /* PWA Install Banner */
    .pwa-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .pwa-banner-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.38;
      min-width: 0;
    }

    .pwa-banner-text strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    .pwa-close-btn {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Header */
    .top-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-mark svg {
      width: 36px;
      height: 36px;
      display: block;
    }

    .brand-titles {
      min-width: 0;
      flex: 1;
    }

    .brand-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Utility Actions (Desempenho / Resetar) */
    .utility-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .util-btn {
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .util-btn:active {
      transform: scale(0.98);
    }

    .util-btn.danger-armed {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    /* Week Bar */
    .week-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 8px 10px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .week-nav-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .week-center {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .week-label-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .week-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .today-jump-btn {
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-primary);
      border-radius: var(--radius-pill);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .week-dates {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.2;
    }

    /* 4 Symmetric Navigation Buttons with Percentage Rings */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .nav-pill {
      width: 100%;
      min-height: 58px;
      padding: 10px 12px;
      border-radius: var(--radius-lg);
      border: 1.5px solid transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .nav-pill:active {
      transform: scale(0.985);
    }

    .nav-pill-label {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .nav-pill[data-tab="overview"] {
      background: var(--overview-bg);
      border-color: var(--overview-border);
      color: var(--overview-accent);
    }

    .nav-pill[data-tab="metas"] {
      background: var(--phase1-bg);
      border-color: var(--phase1-border);
      color: var(--phase1-accent);
    }

    .nav-pill[data-tab="tarefas"] {
      background: var(--phase2-bg);
      border-color: var(--phase2-border);
      color: var(--phase2-accent);
    }

    .nav-pill[data-tab="agenda"] {
      background: var(--phase3-bg);
      border-color: var(--phase3-border);
      color: var(--phase3-accent);
    }

    .nav-pill.is-active {
      border-color: currentColor;
      box-shadow: 0 6px 16px rgba(31, 36, 55, 0.1);
    }

    /* Percentage Ring */
    .ring-wrap {
      position: relative;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ring-svg {
      width: 38px;
      height: 38px;
      transform: rotate(-90deg);
      display: block;
    }

    .ring-track {
      fill: none;
      stroke: rgba(31, 36, 55, 0.12);
      stroke-width: 3.4;
    }

    .ring-progress {
      fill: none;
      stroke: currentColor;
      stroke-width: 3.4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s ease;
    }

    .ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    /* Phase Sections */
    .sections-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .phase-card {
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--border-soft);
      padding: 16px 14px;
      box-shadow: var(--shadow-sm);
    }

    .phase-card.phase-1 {
      background: var(--phase1-bg);
      border-color: var(--phase1-border);
    }

    .phase-card.phase-2 {
      background: var(--phase2-bg);
      border-color: var(--phase2-border);
    }

    .phase-card.phase-3 {
      background: var(--phase3-bg);
      border-color: var(--phase3-border);
    }

    .phase-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .phase-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }

    .phase-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text-primary);
      border: 1px solid rgba(31, 36, 55, 0.08);
      white-space: nowrap;
    }

    .primary-add-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: none;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .primary-add-btn:active {
      transform: scale(0.985);
    }

    .phase-1 .primary-add-btn {
      background: var(--phase1-accent);
    }

    .phase-2 .primary-add-btn {
      background: var(--phase2-accent);
    }

    .phase-3 .primary-add-btn {
      background: var(--phase3-accent);
    }

    /* On-demand Forms */
    .inline-form-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .form-heading {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .field-group {
      margin-bottom: 10px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .field-input,
    .field-select {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: #ffffff;
      color: var(--text-primary);
      font-size: 14px;
    }

    .field-input:focus,
    .field-select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.25);
      border-color: var(--phase1-accent);
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 4px 0 8px;
    }

    .checkbox-line input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--phase3-accent);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-cancel {
      min-height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 700;
    }

    .btn-save {
      min-height: 42px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--text-primary);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
    }

    /* Goal Cards (Fase 1) */
    .items-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .goal-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
    }

    .goal-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .goal-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-primary);
      word-break: break-word;
    }

    .goal-top-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-action-btn {
      height: 30px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .mini-action-btn.armed {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .goal-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .freq-select {
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 700;
    }

    .goal-status-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .goal-status-pill.complete {
      background: #dcfce7;
      color: #15803d;
    }

    .cycle-line {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .cycle-bar-track {
      width: 100%;
      height: 6px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .cycle-bar-fill {
      height: 100%;
      background: var(--phase1-accent);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .day-btn {
      min-height: 52px;
      padding: 5px 2px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .day-btn:active {
      transform: scale(0.95);
    }

    .day-btn.is-today {
      box-shadow: inset 0 0 0 1.5px var(--phase1-accent);
    }

    .day-name {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .day-num {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.78;
      line-height: 1;
    }

    .day-mark {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.05;
    }

    .day-btn.state-done {
      background: #dcfce7;
      border-color: #86efac;
      color: #15803d;
    }

    .day-btn.state-missed {
      background: #ffe4e6;
      border-color: #fda4af;
      color: #be123c;
    }

    /* Task Lists & Tasks (Fase 2) */
    .task-list-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
    }

    .task-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .task-list-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: var(--bg-page);
      margin-bottom: 7px;
    }

    .task-row:last-child {
      margin-bottom: 0;
    }

    .task-toggle-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: var(--text-primary);
    }

    .check-box {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 7px;
      border: 2px solid var(--border-strong);
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    .task-row.is-done .check-box {
      background: var(--phase2-accent);
      border-color: var(--phase2-accent);
    }

    .task-text {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }

    .task-row.is-done .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* Agenda Items (Fase 3) */
    .agenda-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
    }

    .agenda-row.is-today {
      border-color: #f5b453;
    }

    .agenda-main-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: var(--text-primary);
    }

    .agenda-row.is-done .check-box {
      background: var(--phase3-accent);
      border-color: var(--phase3-accent);
    }

    .agenda-info {
      min-width: 0;
      flex: 1;
    }

    .agenda-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--phase3-accent);
    }

    .agenda-today-tag {
      background: #fff1d6;
      color: #9a4305;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      font-size: 10.5px;
      font-weight: 800;
    }

    .agenda-title {
      font-size: 14px;
      font-weight: 700;
      c
